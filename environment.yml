name: MRI
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy<2
  - scipy
  - scikit-image
  - matplotlib
  - pandas
  - openpyxl
  - tqdm
  - opencv
  - nibabel
  - pip:
      - --index-url https://download.pytorch.org/whl/cu128
      - torch
      - torchvision
      - torchaudio
      - --extra-index-url https://pypi.org/simple
      - pytorch-msssim
